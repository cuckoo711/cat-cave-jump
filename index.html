<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>仙人跳 · Fairy jump</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #14161a;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
    }
    body { position: fixed; inset: 0; overscroll-behavior: none; }
    #gameCanvas { display: block; touch-action: none; -webkit-touch-callout: none; }
    #gameControls {
        position: fixed; z-index: 2;
        display: flex; flex-direction: column; gap: 8px;
        bottom: max(12px, env(safe-area-inset-bottom));
        right: max(12px, env(safe-area-inset-right));
    }
    #gameControls button {
        min-width: 112px; min-height: 44px;
        padding: 8px 12px; border: 1px solid #68737d; border-radius: 10px;
        background: #20262de6; color: #eef3f8;
        font: 14px "Microsoft YaHei", sans-serif; touch-action: manipulation;
    }
    #gameControls button:focus-visible { outline: 2px solid #7ef0c8; outline-offset: 3px; }

    #ui {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        left: max(18px, env(safe-area-inset-left));
        color: #eef3f8;
        font: bold 26px/1.2 "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        text-shadow: 0 2px 6px rgba(0,0,0,.85);
        pointer-events: none;
        letter-spacing: 1px;
    }
    #ui small { display: block; font-size: 14px; font-weight: normal; opacity: .65; margin-top: 4px; letter-spacing: 2px; }
    #ui .correctionLabel { margin-top: 9px; }
    #lives { display: block; margin-top: 2px; font-size: 26px; color: #f28e9b; letter-spacing: 5px; }
    #missionHud {
        position: fixed; z-index: 1; pointer-events: none;
        top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
        box-sizing: border-box; width: min(298px, calc(100vw - 118px));
        padding: 11px 12px 9px; border-radius: 12px; border: 1px solid #445954;
        background: #101b1bed; color: #e6f1ef;
        font: 12px/1.4 "PingFang SC", "Microsoft YaHei", sans-serif;
        font-variant-numeric: tabular-nums;
    }
    #missionHud header, #missionHud footer, #missionHud dl { display: flex; justify-content: space-between; gap: 6px; }
    #missionPhase { font-size: 13px; font-weight: 700; color: #a6ebd8; }
    #missionHud footer, #missionHud dt, #missionHud header span { color: #b0c0bc; }
    #missionHud dl { margin: 8px 0 6px; }
    #missionHud dd { margin: 0; font-size: clamp(14px, 2.8vw, 20px); font-weight: 700; white-space: nowrap; }
    #missionMap { display: block; width: 100%; height: 58px; }
    #missionCorrection[data-active="true"] { color: #ffcb86; }
    @media (max-width: 600px), (max-height: 500px) {
        #ui { font-size: 22px; }
        #ui small { font-size: 12px; }
        #missionHud { padding: 7px 8px; }
    }
    @media (max-width: 600px) {
        #ui { max-width: 86px; }
        #score { display: block; }
        #ui small { letter-spacing: .5px; }
    }
    @media (max-height: 500px) {
        #missionHud { width: min(248px, calc(100vw - 118px)); }
        #missionMap { height: 46px; }
        #gameControls { flex-direction: row; }
    }
    @media (max-width: 600px) and (orientation: portrait) {
        #ui, #missionHud, #gameControls {
            left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right));
        }
        #ui {
            top: max(8px, env(safe-area-inset-top)); z-index: 1;
            display: flex; justify-content: space-between; align-items: center; gap: 6px;
            max-width: none; padding: 0 10px; height: 36px;
            border: 1px solid #445954; border-radius: 10px; background: #101b1bed;
            font-size: 15px; letter-spacing: 0; font-variant-numeric: tabular-nums;
        }
        #ui small { margin: 0; letter-spacing: 0; }
        #ui .buildVersion { display: none; }
        #score { display: inline; }
        #ui .landingBudget { display: flex; align-items: center; gap: 5px; }
        #ui .correctionLabel { margin: 0; }
        #lives { margin: 0; font-size: 18px; letter-spacing: 2px; }
        #missionHud { top: calc(max(8px, env(safe-area-inset-top)) + 44px); width: auto; padding: 7px 9px; }
        #missionHud dd { font-size: 16px; }
        #missionHud dl { margin: 5px 0 4px; }
        #missionMap { height: 46px; }
        #gameControls { flex-direction: row; justify-content: flex-end; }
    }
</style>
</head>
<body>

    <div>得分 <span id="score">0</span></div>
    <small id="best">最佳 0</small>
    <div class="landingBudget"><small class="correctionLabel" aria-hidden="true">师傅修正</small><span id="lives" role="img" aria-label="师傅修正剩余 3 次">♥♥♥</span></div>
    <small class="buildVersion">v1.1.6</small>
</div>
<section id="missionHud" aria-label="往返任务与小地图">

        <div><dt>距目标</dt><dd id="missionRemaining">15.00 km</dd></div>
        <div><dt>已掘进</dt><dd id="missionDistance">0 m</dd></div>

    </dl>

<button id="muteButton" type="button" aria-pressed="false" aria-label="静音">静音</button>
<button id="landingHintButton" type="button" aria-pressed="false">落点提示：关</button>
</div>

<script src="audio-bank.js"></script>
<script src="game-audio.js"></script>
<script src="tunnel-mission.js"></script>
<script>
"use strict";
/* =====================================================================
   2.5D 洞穴传送版跳一跳
   素材接口：把横向 5 帧等分长图（透明底）命名为 player.png 放在同级目录。
   帧顺序：① 自然站立 ② 蓄力下沉/起跳 ③ 腾空最高点 ④ 平缓下落 ⑤ 直接落地
   通过 HTTP 访问时，带纯色底的 player.jpg 会自动按背景色抠底。
   ===================================================================== */

/* ------------------------- 可调参数 ------------------------- */
const SCENE_UNITS_PER_METRE = 72;
const CFG = {
    rabbitSpriteSrc: "assets/player-rabbit.png",
    playerMotionSrc: "assets/player-motion.png",
    rabbitMotionSrc: "assets/player-rabbit-motion.png",
    spriteSrc: "player.png",      // 人物雪碧图
    easterEggSrc: "assets/easter-300.png",
    undergroundSrc: "assets/underground-strata.png",
    frameCount: 5,                // 横向帧数
    cavityRadius: 1.25 * SCENE_UNITS_PER_METRE,
    cavityRadiusVar: .025 * SCENE_UNITS_PER_METRE,
    cavityHorizontalRadius: 1.08,
    cavityCenterHeight: .84,
    cavityVerticalRadius: .96,
    plannedLandingTolerance: 8,
    freeOverlap: 1 / 3,
    landingCorrectionLimit: 3,
    entranceOffset: 30,
    entranceMinRise: 12,
    startDepth: -1800,
    gapMin: 8 * SCENE_UNITS_PER_METRE,
    gapMax: 8.8 * SCENE_UNITS_PER_METRE,
    difficultyStart: 150,         // Count cavities reached, independently of score.
    chargeMs: 1500,               // 蓄满所需毫秒（已调慢，手感平缓）
    jumpMin: 1.3 * SCENE_UNITS_PER_METRE, // 场景距离。任务里程按蓄力另行计算。
    jumpMax: 9 * SCENE_UNITS_PER_METRE,
    fallGravity: 2900,            // 下落加速度 px/s^2
    hopH: 14,                     // 松开后小跳的高度
    takeoffMs: 125,               // 起跳前重心短暂下沉
    hopMs: 340,                   // 小跳时长
    sinkMs: 240,                  // 小跳落回后沉入黑洞的时长
    playerH: 1.75 * SCENE_UNITS_PER_METRE
};

/* ------------------------- 画布 ------------------------- */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const missionPanel = document.getElementById("missionHud");
const controls = document.getElementById("gameControls");
const portraitLayout = window.matchMedia("(max-width: 600px) and (orientation: portrait)");
// Keep physics in world units; scale only the display for small screens.
let DPR = 1, VW = 0, VH = 0, viewScale = 1;
let sceneCenterX = 0, sceneCenterY = 0, introY = 0, promptTop = 0;
function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const visual = window.visualViewport;
    const width = Math.max(1, visual ? visual.width : window.innerWidth);
    const height = Math.max(1, visual ? visual.height : window.innerHeight);
    const portrait = portraitLayout.matches;
    const panel = missionPanel.getBoundingClientRect();
    const stageWidth = !portrait && width >= 680 ? panel.left - 12 : width;
    const stageTop = portrait ? panel.bottom + 10 : 0;
    const controlsTop = portrait ? controls.getBoundingClientRect().top : height;
    const stageBottom = Math.max(stageTop + 1, controlsTop - 56);
    const stageScale = portrait ? (stageBottom - stageTop) / 600 : 1;
    viewScale = Math.min(1, stageWidth / 1000, height / 720, stageScale);
    VW = width / viewScale; VH = height / viewScale;
    sceneCenterX = stageWidth / (2 * viewScale);
    sceneCenterY = portrait ? (stageTop + stageBottom) / (2 * viewScale) + CFG.cavityRadius * .9 : VH * .58;
    introY = portrait ? (controlsTop - 42) / viewScale : VH * .78;
    promptTop = width < 720 ? (panel.bottom + 20) / viewScale : 0;
    canvas.width = Math.round(width * DPR); canvas.height = Math.round(height * DPR);
    canvas.style.width = width + "px"; canvas.style.height = height + "px";
    ctx.setTransform(DPR * viewScale, 0, 0, DPR * viewScale, 0, 0);
}
window.addEventListener("resize", resize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
resize();

/* ------------------------- 工具 ------------------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
// Project the mission's length, lateral drift and depth onto the cave view.
const projectMission = ({ x, y, z }) => ({ x: x + y * .32, y: z + y * .32 });

/* ------------------------- 素材加载 ------------------------- */
let sprite = null;          // 处理好的透明 canvas
let spriteFrames = [];      // 每帧 {sx, sy, sw, sh}
let spriteReady = false;
const rabbitSprite = { image: null, frames: [], ready: false };
const playerMotion = { image: null, frames: [], ready: false };
const rabbitMotion = { image: null, frames: [], ready: false };
const easterEggImage = new Image();
let easterEggReady = false;
easterEggImage.onload = () => { easterEggReady = true; };
easterEggImage.onerror = () => { easterEggReady = false; };
easterEggImage.src = CFG.easterEggSrc;

// 内置贴图的帧边界和脚底锚点，供 file:// 禁止读取像素时使用。
const bundledSpriteFrames = {
    width: 2172,
    height: 724,
    player: [
        { sx: 132, sy: 129, sw: 188, sh: 563, anchorX: 118 },
        { sx: 529, sy: 124, sw: 238, sh: 561, anchorX: 137 },
        { sx: 975, sy: 37, sw: 209, sh: 583, anchorX: 109.5 },
        { sx: 1350, sy: 89, sw: 266, sh: 596, anchorX: 171 },
        { sx: 1852, sy: 129, sw: 188, sh: 564, anchorX: 113 }
    ],
    rabbit: [
        { sx: 127, sy: 172, sw: 209, sh: 532, anchorX: 123.5 },
        { sx: 542, sy: 127, sw: 224, sh: 545, anchorX: 126 },
        { sx: 959, sy: 61, sw: 234, sh: 535, anchorX: 119.5 },
        { sx: 1393, sy: 47, sw: 195, sh: 656, anchorX: 92.5 },
        { sx: 1832, sy: 176, sw: 210, sh: 528, anchorX: 115.5 }
    ],
    playerMotion: [
        { sx: 254, sy: 120, sw: 262, sh: 573, anchorX: 112.5 },
        { sx: 973, sy: 153, sw: 236, sh: 540, anchorX: 117.5 },
        { sx: 1681, sy: 87, sw: 220, sh: 606, anchorX: 110 }
    ],
    rabbitMotion: [
        { sx: 245, sy: 154, sw: 254, sh: 540, anchorX: 110.5 },
        { sx: 977, sy: 160, sw: 243, sh: 534, anchorX: 111 },
        { sx: 1688, sy: 86, sw: 230, sh: 608, anchorX: 123.5 }
    ]
};
function chromaKey(d) {
    const br = d[0], bgc = d[1], bb = d[2];   // 左上角作为底色
    for (let i = 0; i < d.length; i += 4) {
        const dist = Math.abs(d[i] - br) + Math.abs(d[i + 1] - bgc) + Math.abs(d[i + 2] - bb);
        if (dist < 40) d[i + 3] = 0;
        else if (dist < 95) d[i + 3] = Math.round(255 * (dist - 40) / 55);
    }
}
function buildSprite(img, target, bundledFrames) {
    const width = img.naturalWidth, height = img.naturalHeight;
    let sheet = document.createElement("canvas");
    sheet.width = width; sheet.height = height;
    const sheetCtx = sheet.getContext("2d");
    sheetCtx.drawImage(img, 0, 0);
    let pixels;
    try {
        const imageData = sheetCtx.getImageData(0, 0, width, height);
        if (imageData.data[3] > 200) {
            chromaKey(imageData.data);
            sheetCtx.putImageData(imageData, 0, 0);
        }
        pixels = imageData.data;
    } catch (error) {
        if (error.name !== "SecurityError") throw error;
        sheet = img;  // 文件模式允许绘制原图，读取像素时才会触发安全限制。
    }
    const fallbackFrames = width === bundledSpriteFrames.width && height === bundledSpriteFrames.height
        ? bundledFrames : null;
    const frameCount = bundledFrames?.length ?? CFG.frameCount;
    const fw = width / frameCount, fh = height;
    const frames = Array.from({ length: frameCount }, (_, i) => {
        const start = Math.round(i * fw), end = Math.round((i + 1) * fw);
        const fullFrame = { sx: start, sy: 0, sw: end - start, sh: fh };
        if (!pixels) return fallbackFrames?.[i] ?? fullFrame;
        let left = end, right = start, top = fh, bottom = 0;
        for (let y = 0; y < fh; y++) for (let x = start; x < end; x++) {
            if (pixels[(y * width + x) * 4 + 3] > 16) {
                left = Math.min(left, x); right = Math.max(right, x);
                top = Math.min(top, y); bottom = Math.max(bottom, y);
            }
        }
        if (right < left || bottom < top) return fullFrame;
        let footLeft = right, footRight = left;
        for (let y = Math.max(top, bottom - Math.ceil((bottom - top) * .08)); y <= bottom; y++) {
            for (let x = left; x <= right; x++) if (pixels[(y * width + x) * 4 + 3] > 128) {
                footLeft = Math.min(footLeft, x); footRight = Math.max(footRight, x);
            }
        }
        const anchorX = footRight >= footLeft ? (footLeft + footRight) / 2 - left : (right - left + 1) / 2;
        return { sx: left, sy: top, sw: right - left + 1, sh: bottom - top + 1, anchorX };
    });
    const referenceHeight = Math.max(...frames.map(f => f.sh));
    const renderFrames = frames.map(frame => ({ ...frame, referenceHeight }));
    if (target) {
        target.image = sheet; target.frames = renderFrames; target.ready = true;
    } else {
        sprite = sheet; spriteFrames = renderFrames; spriteReady = true;
    }
}
(function loadSprite() {
    const img = new Image();
    img.onload = () => buildSprite(img, null, bundledSpriteFrames.player);
    img.onerror = () => {                          // 退而求其次找 jpg
        const j = new Image();
        j.onload = () => buildSprite(j);
        j.onerror = () => { spriteReady = false; }; // 用矢量占位人物
        j.src = "player.jpg";
    };
    img.src = CFG.spriteSrc;
})();
function loadExtraSprite(src, target, frames) {
    const img = new Image();
    img.onload = () => buildSprite(img, target, frames);
    img.src = src;
}
loadExtraSprite(CFG.rabbitSpriteSrc, rabbitSprite, bundledSpriteFrames.rabbit);
loadExtraSprite(CFG.playerMotionSrc, playerMotion, bundledSpriteFrames.playerMotion);
loadExtraSprite(CFG.rabbitMotionSrc, rabbitMotion, bundledSpriteFrames.rabbitMotion);

/* ------------------------- 音效（WebAudio 合成，无外部文件） ------------------------- */
const SFX = {
    ctx: null, _muted: false,
    get muted() { return this._muted; },
    set muted(value) { this._muted = !!value; RecordedAudio.setMuted(this._muted); },
    ensure() { if (!this.ctx) { try { this.ctx = RecordedAudio.ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (this.ctx && this.ctx.state === "suspended" && !this.muted) this.ctx.resume().catch(() => {}); },
    tone(f0, f1, dur, type, vol, delay) {
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime + (delay || 0);
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol || .18, t + .012);
        g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        o.connect(g).connect(RecordedAudio.master || this.ctx.destination);
        o.start(t); o.stop(t + dur + .02);
    },
    noise(dur, vol, fc) {
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime, n = this.ctx.sampleRate * dur;
        const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const s = this.ctx.createBufferSource(); s.buffer = buf;
        const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = fc || 900;
        const g = this.ctx.createGain(); g.gain.value = vol || .2;
        s.connect(f).connect(g).connect(RecordedAudio.master || this.ctx.destination); s.start(t);
    },
    charge() { this.tone(140, 420, .35, "sine", .1); },
    hop() { RecordedAudio.play('jump'); },
    portal() { this.noise(.32, .16, 700); this.tone(520, 90, .3, "sine", .12); },
    drop() { this.tone(700, 180, .35, "triangle", .1); },
    land() { RecordedAudio.play('meow'); },
    perfect() { /* Keep the landing voice clear. */ },
    fail() { this.tone(300, 60, .7, "sawtooth", .12); }
};

/* ------------------------- 游戏状态 ------------------------- */
const ST = { IDLE: 0, CHARGING: 1, SINK: 2, FALLING: 4, LAND: 5, DYING: 6, OVER: 7, HOP: 8, COMPLETE: 9, TAKEOFF: 10 };
let state = ST.IDLE;
let stateT = 0;                 // 当前状态已持续时间(s)
let score = 0, combo = 0;
let landingCorrections = CFG.landingCorrectionLimit;
function syncLandingCorrections() {
    const node = document.getElementById("lives");
    node.textContent = "♥".repeat(landingCorrections) + "♡".repeat(CFG.landingCorrectionLimit - landingCorrections);
    node.setAttribute("aria-label", "师傅修正剩余 " + landingCorrections + " 次");
    node.title = node.getAttribute("aria-label");
}
let best = +(localStorage.getItem("cavejump_best") || 0);
document.getElementById("best").textContent = "最佳 " + best;

function saveBest() {
    if (score <= best) return;
    best = score;
    localStorage.setItem("cavejump_best", best);
    document.getElementById("best").textContent = "最佳 " + best;
}

const cavities = [];
let currentCavity, nextCavity;
let player = { wx: 0, wy: 0, sink: 0, drop: 0, fallV: 0, squash: 0, wobble: 0, frame: 0 };
let power = 0;                  // 0..1
let jumpDir = { x: 1, y: 0 };   // 本次跳跃方向（世界轴）
let landInfo = null;
const hopStart = { wx: 0, wy: 0 };
const hole = { wx: 0, wy: 0, r: 0, active: false };
const skyHole = { wx: 0, wy: 0, height: 0, active: false };
let cam = { wx: 0, wy: 0 };
let started = false;
let missionCavity = null;
let rabbitForm = false, rabbitTransformPending = false, rabbitSubtitleTime = 0;
const mission = new TunnelMission();
let nextMove = null;
const tunnelCamera = { along: 0, depth: 0 };
const missionMap = document.getElementById("missionMap");
const mapCtx = missionMap.getContext("2d");
const missionHud = {
    phase: document.getElementById("missionPhase"),
    remaining: document.getElementById("missionRemaining"),
    distance: document.getElementById("missionDistance"),
    jump: document.getElementById("missionJump"),
    depth: document.getElementById("missionDepth"),
    correction: document.getElementById("missionCorrection")
};

function formatDistance(metres) {
    return metres >= 1000 ? (metres / 1000).toFixed(2) + " km" : Number(metres.toFixed(1)) + " m";
}

function syncMissionHud() {
    const phases = { outbound: "去程 · 任务点", return: "返程 · 出发点", complete: "往返完成" };
    const phase = phases[mission.phase];
    if (missionHud.phase.textContent !== phase) missionHud.phase.textContent = phase;
    missionHud.remaining.textContent = formatDistance(mission.remaining);
    missionHud.distance.textContent = formatDistance(mission.travelled);
    missionHud.jump.textContent = formatDistance(mission.lastJump);
    missionHud.depth.textContent = "相对深度 " + Math.round(CFG.startDepth - mission.position.z) + " m";
    missionHud.correction.textContent = (mission.corrected ? "已矫正 · " : "航向矫正 ") + mission.corrections + " 次";
    missionHud.correction.dataset.active = String(mission.corrected);
    drawMissionMap();
}

function drawMissionMap() {
    const width = missionMap.clientWidth, height = missionMap.clientHeight;
    const pixelWidth = Math.round(width * DPR), pixelHeight = Math.round(height * DPR);
    if (missionMap.width !== pixelWidth || missionMap.height !== pixelHeight) {
        missionMap.width = pixelWidth;
        missionMap.height = pixelHeight;
    }
    mapCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    mapCtx.clearRect(0, 0, width, height);
    const along = mission.route.reduce((bounds, p) => [Math.min(bounds[0], p.x), Math.max(bounds[1], p.x)], [0, TunnelMission.legDistance]);
    const xOf = p => 14 + (p.x - along[0]) * (width - 28) / (along[1] - along[0]);
    const outboundColor = "#78dfc2";
    const returnColor = "#f4bd7c";

    const extent = mission.route.reduce((maximum, p) => Math.max(maximum, Math.abs(p.y)), 120);
    const baseline = height * .69;
    const yOf = p => baseline + p.y * height * .21 / extent;
    mapCtx.fillStyle = "#182728";
    mapCtx.beginPath(); mapCtx.roundRect(0, 1, width, height - 2, 7); mapCtx.fill();
    mapCtx.fillStyle = "#b0c0bc";

    mapCtx.strokeStyle = "#657a76";
    mapCtx.lineWidth = 1;
    mapCtx.setLineDash([3, 4]);
    mapCtx.beginPath(); mapCtx.moveTo(xOf(mission.origin), baseline); mapCtx.lineTo(xOf(mission.destination), baseline); mapCtx.stroke();
    mapCtx.setLineDash([]);

    const turn = mission.turnIndex ?? mission.route.length - 1;
    for (const [first, last, color] of [[0, turn, outboundColor], [turn, mission.route.length - 1, returnColor]]) {
        mapCtx.strokeStyle = color;
        mapCtx.lineWidth = 1.5;
        mapCtx.beginPath();
        for (let i = first; i <= last; i++) {
            const point = mission.route[i];
            if (i === first) mapCtx.moveTo(xOf(point), yOf(point));
            else mapCtx.lineTo(xOf(point), yOf(point));
        }
        mapCtx.stroke();
    }

    mapCtx.fillStyle = outboundColor;
    mapCtx.beginPath(); mapCtx.arc(xOf(mission.origin), baseline, 3.5, 0, Math.PI * 2); mapCtx.fill();
    mapCtx.fillStyle = returnColor;
    mapCtx.save(); mapCtx.translate(xOf(mission.destination), baseline); mapCtx.rotate(Math.PI / 4);
    mapCtx.fillRect(-3, -3, 6, 6); mapCtx.restore();

    mapCtx.fillStyle = "#f4fffa";
    mapCtx.save();
    mapCtx.translate(xOf(mission.position), yOf(mission.position));
    const heading = nextMove?.direction ?? mission.heading;
    mapCtx.rotate(Math.atan2(heading.y, heading.x));
    mapCtx.beginPath(); mapCtx.moveTo(6, 0); mapCtx.lineTo(-5, -4); mapCtx.lineTo(-3, 0); mapCtx.lineTo(-5, 4);
    mapCtx.closePath(); mapCtx.fill(); mapCtx.restore();
}

const dust = [], bursts = [], popups = [];
for (let i = 0; i < 70; i++) dust.push({ x: Math.random(), y: Math.random(), s: rand(.4, 1.6), p: Math.random() * 7, v: rand(.008, .03) });

function cavityDifficulty(sequence) {
    if (sequence <= CFG.difficultyStart) return { size: 1, minGap: CFG.gapMin, maxGap: CFG.gapMax };
    const progress = clamp((sequence - CFG.difficultyStart) / 100, 0, 1);
    return {
        size: lerp(.99, .96, progress),
        minGap: lerp(8.05, 8.25, progress) * SCENE_UNITS_PER_METRE,
        maxGap: lerp(8.85, 8.96, progress) * SCENE_UNITS_PER_METRE
    };
}
function createCavity(wx, wy, radius, sequence, correction = null) {
    return { wx, wy, radius, sequence, correction, open: .12, mergedWith: null, mergedInto: null };
}
function carveNextCavity() {
    nextMove = mission.planMove();
    const heading = nextMove.direction;
    const projected = projectMission(heading);
    const ray = Math.hypot(projected.x, projected.y) > 1e-8 ? projected : { x: heading.x, y: heading.z };
    const length = Math.hypot(ray.x, ray.y);
    const direction = { x: ray.x / length, y: ray.y / length };
    const sequence = currentCavity.sequence + 1;
    const difficulty = cavityDifficulty(sequence);
    const radius = (CFG.cavityRadius + rand(-CFG.cavityRadiusVar, CFG.cavityRadiusVar)) * difficulty.size;
    const minGap = difficulty.minGap, maxGap = difficulty.maxGap;
    let freeGaps = [[minGap, maxGap]];
    for (const cavity of cavities) {
        const dx = cavity.wx - currentCavity.wx, dy = cavity.wy - currentCavity.wy;
        const along = dx * direction.x + dy * direction.y;
        const across = dx * direction.y - dy * direction.x;
        const clearance = radius + cavity.radius + 8;
        if (Math.abs(across) >= clearance || along + clearance <= minGap || along - clearance >= maxGap) continue;
        const reach = Math.sqrt(clearance ** 2 - across ** 2);
        const blockedFrom = along - reach, blockedTo = along + reach;
        freeGaps = freeGaps.flatMap(([from, to]) => {
            if (blockedTo <= from || blockedFrom >= to) return [[from, to]];
            const parts = [];
            if (from < blockedFrom) parts.push([from, blockedFrom]);
            if (blockedTo < to) parts.push([blockedTo, to]);
            return parts;
        });
        if (!freeGaps.length) break;
    }
    // A return crossing may run through earlier excavations. Keep the route bearing.
    const available = freeGaps[Math.floor(Math.random() * freeGaps.length)];
    const gap = available ? rand(...available) : CFG.jumpMax;
    const candidate = createCavity(currentCavity.wx + direction.x * gap,
        currentCavity.wy + direction.y * gap, radius, sequence);
    cavities.push(candidate);
    return candidate;
}

function reset() {
    landingCorrections = CFG.landingCorrectionLimit; syncLandingCorrections();
    RecordedAudio.stopVoice();
    cavities.length = 0;
    currentCavity = createCavity(0, 0, CFG.cavityRadius, 0);
    currentCavity.open = 1;
    cavities.push(currentCavity);
    mission.reset();
    nextCavity = carveNextCavity();
    player.wx = 0; player.wy = 0; player.sink = 0; player.drop = 0; player.fallV = 0; player.squash = 0; player.wobble = 0;
    power = 0; landInfo = null;
    hole.active = false; skyHole.active = false;
    cam.wx = lerp(currentCavity.wx, nextCavity.wx, .5);
    cam.wy = lerp(currentCavity.wy, nextCavity.wy, .5);
    score = 0; combo = 0;
    missionCavity = null;
    tunnelCamera.along = 0; tunnelCamera.depth = 0;
    syncMissionHud();
    rabbitForm = false; rabbitTransformPending = false; rabbitSubtitleTime = 0;
    document.getElementById("score").textContent = 0;
    state = ST.IDLE; stateT = 0; started = false;
    popups.length = 0; bursts.length = 0;
}

/* ------------------------- 判定 ------------------------- */
const jumpDist = () => CFG.jumpMin + power * (CFG.jumpMax - CFG.jumpMin);
const cavityCeiling = p => p.radius * (CFG.cavityCenterHeight + CFG.cavityVerticalRadius);

function sphereOverlap(distance, radius) {
    // Intersection volume divided by one sphere's volume, for two equal spheres.
    const separation = Math.min(distance / radius, 2);
    return (4 + separation) * (2 - separation) ** 2 / 16;
}

function predictLanding() {
    const distance = jumpDist();
    const wx = hopStart.wx + jumpDir.x * distance, wy = hopStart.wy + jumpDir.y * distance;
    const target = nextCavity;
    const offset = Math.hypot(wx - target.wx, wy - target.wy);
    const overlap = sphereOverlap(offset, target.radius);
    if (offset <= CFG.plannedLandingTolerance) return { wx: target.wx, wy: target.wy, target, overlap, kind: "perfect", cavity: target };
    const kind = overlap + Number.EPSILON >= CFG.freeOverlap ? "overlap" : landingCorrections > 0 ? "correction" : "miss";
    return { wx, wy, target, overlap, kind, cavity: null };
}

function openLandingExit() {
    const { wx, wy, target, kind } = landInfo;
    if (kind === "correction") {
        landingCorrections--;
        syncLandingCorrections();
    }
    if (kind === "overlap" || kind === "correction") {
        landInfo.cavity = createCavity(wx, wy, target.radius, target.sequence, kind);
        landInfo.cavity.open = 1;
        if (kind === "overlap") {
            landInfo.cavity.mergedWith = target;
            target.mergedInto = landInfo.cavity;
        }
        cavities.push(landInfo.cavity);
        dustBurst(projOf(wx, wy), 14);
    }
    skyHole.wx = wx; skyHole.wy = wy;
    skyHole.height = cavityCeiling(landInfo.cavity || target);
    skyHole.active = true;
    player.sink = 0;
    state = ST.SINK; stateT = 0;
    SFX.portal();
}

/* ------------------------- 更新 ------------------------- */
function update(dt) {
    rabbitSubtitleTime = Math.max(0, rabbitSubtitleTime - dt);
    stateT += dt;
    if (nextCavity && nextCavity.open < 1) nextCavity.open = Math.min(1, nextCavity.open + dt * 5);
    // 相机目标
    let tx, ty;
    if (state === ST.SINK) {
        tx = lerp(currentCavity.wx, skyHole.wx, .5);
        ty = lerp(currentCavity.wy, skyHole.wy, .5);
    } else if (state === ST.FALLING || state === ST.DYING) {
        tx = player.wx; ty = player.wy;
    } else {
        const ahead = nextCavity || currentCavity;
        tx = lerp(currentCavity.wx, ahead.wx, .5);
        ty = lerp(currentCavity.wy, ahead.wy, .5);
        if (portraitLayout.matches && currentCavity.mergedWith) {
            let left = Infinity, right = -Infinity;
            for (const cavity of [currentCavity, currentCavity.mergedWith, ahead]) {
                const x = cavity.wx, width = cavity.radius * CFG.cavityHorizontalRadius;
                left = Math.min(left, x - width);
                right = Math.max(right, x + width);
            }
            tx = (left + right) / 2;
        }
    }
    const k = 1 - Math.pow(0.0016, dt);
    cam.wx = lerp(cam.wx, tx, k); cam.wy = lerp(cam.wy, ty, k);
    const tunnelPosition = projectMission(mission.position);
    tunnelCamera.along = lerp(tunnelCamera.along, tunnelPosition.x, k);
    tunnelCamera.depth = lerp(tunnelCamera.depth, tunnelPosition.y, k);

    switch (state) {
        case ST.CHARGING: {
            power = clamp(stateT * 1000 / CFG.chargeMs, 0, 1);
            break;
        }
        case ST.TAKEOFF: {
            const crouch = clamp(stateT * 1000 / CFG.takeoffMs, 0, 1);
            hole.r = lerp(.18, .58, crouch);
            if (crouch >= 1) { state = ST.HOP; stateT = 0; SFX.hop(); }
            break;
        }
        case ST.HOP: {
            const hop = clamp(stateT * 1000 / CFG.hopMs, 0, 1);
            hole.r = lerp(.58, .95, clamp(hop * 2, 0, 1));
            player.wx = lerp(hopStart.wx, hole.wx, hop);
            player.wy = lerp(hopStart.wy, hole.wy, hop);
            if (hop >= 1) openLandingExit();
            break;
        }
        case ST.SINK: {
            const progress = clamp(stateT * 1000 / CFG.sinkMs, 0, 1);
            player.sink = progress * progress;
            if (progress >= 1) {
                if (rabbitTransformPending) {
                    rabbitForm = true; rabbitTransformPending = false; rabbitSubtitleTime = 4.5;
                }
                const frames = rabbitForm && rabbitSprite.ready ? rabbitSprite.frames : spriteFrames;
                player.wx = skyHole.wx; player.wy = skyHole.wy;
                player.drop = frameHeight(frames[1]) - skyHole.height;
                player.fallV = 0;
                hole.active = false;
                state = ST.FALLING; stateT = 0;
                SFX.drop();
            }
            break;
        }
        case ST.FALLING: {
            player.fallV += CFG.fallGravity * dt;
            player.drop += player.fallV * dt;
            if (player.drop >= 0) {
                player.drop = 0;
                resolveLanding();
            }
            break;
        }
        case ST.LAND: {
            player.squash = Math.max(0, player.squash - dt * 4.2);
            player.wobble *= Math.pow(0.02, dt);
            if (stateT > 0.34) {
                state = mission.phase === "complete" ? ST.COMPLETE : nextCavity ? ST.IDLE : ST.OVER;
                stateT = 0; player.squash = 0;
                if (state !== ST.IDLE) saveBest();
            }
            break;
        }
        case ST.DYING: {
            player.fallV += CFG.fallGravity * dt;
            player.drop += player.fallV * dt;
            if (stateT > 1.15) {
                state = ST.OVER; stateT = 0;
                saveBest();
            }
            break;
        }
    }

    // 粒子
    for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += b.g * dt;
        if (b.t > b.life) bursts.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i]; p.t += dt; p.y -= 42 * dt;
        if (p.t > p.life) popups.splice(i, 1);
    }
    for (const m of dust) { m.y -= m.v * dt * 8; m.p += dt; if (m.y < -0.05) { m.y = 1.05; m.x = Math.random(); } }
}

function resolveLanding() {
    skyHole.active = false;
    const { cavity, kind, wx, wy } = landInfo;
    if (!cavity) {
        state = ST.DYING; stateT = 0; player.fallV = 300;
        SFX.fail();
        return;
    }
    currentCavity = cavity;
    player.wx = wx; player.wy = wy;
    player.squash = 1;
    state = ST.LAND; stateT = 0;
    SFX.land();
    dustBurst(projOf(wx, wy), kind === "perfect" ? 26 : 14);
    const phase = mission.phase;
    mission.advance(power, nextMove);
    if (phase === "outbound" && mission.phase === "return") missionCavity = cavity;
    if (mission.phase === "complete") {
        nextCavity = null;
        nextMove = null;
    } else {
        nextCavity = carveNextCavity();
    }
    syncMissionHud();
    if (kind === "perfect") {
        combo++;
        const add = 2 + Math.min(combo - 1, 3);
        score += add;
        popup("PERFECT +" + add + (combo > 1 ? "  x" + combo : ""), "#7ef0c8");
        SFX.perfect();
    } else {
        combo = 0;
        score++;
    }
    document.getElementById("score").textContent = score;
}
function popup(text, color) { popups.push({ text, color, x: VW / 2, y: Math.max(VH * .34, promptTop), t: 0, life: 1.1 }); }
function dustBurst(sp, n) {
    for (let i = 0; i < n; i++) {
        const a = rand(-Math.PI, 0), s = rand(40, 190);
        bursts.push({ x: sp.x + rand(-14, 14), y: sp.y + rand(-4, 4), vx: Math.cos(a) * s * rand(.4, 1), vy: Math.sin(a) * s * .55, g: 320, t: 0, life: rand(.35, .7), r: rand(1.5, 4), c: Math.random() < .5 ? "190,200,212" : "120,130,145" });
    }
}
function projOf(wx, wy) {
    return {
        x: wx - cam.wx + sceneCenterX,
        y: wy - cam.wy + sceneCenterY
    };
}

/* ------------------------- 绘制：洞穴背景 ------------------------- */
const strataSize = 544;
let strataPattern = null;
const strataImage = new Image();
strataImage.onload = () => {
    // Mirror alternate tiles so opposite edges and all tile joins share the same pixels.
    const tile = document.createElement("canvas");
    tile.width = tile.height = strataSize * 2;
    const patternCtx = tile.getContext("2d");
    for (const [x, y] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
        patternCtx.setTransform(x ? -1 : 1, 0, 0, y ? -1 : 1, x * tile.width, y * tile.height);
        patternCtx.drawImage(strataImage, 0, 0, strataSize, strataSize);
    }
    strataPattern = ctx.createPattern(tile, "repeat");
};
strataImage.src = CFG.undergroundSrc;

function drawBackground() {
    const offsetX = -(tunnelCamera.along * 1.2) % (strataSize * 2);
    const offsetY = -(tunnelCamera.depth * 2.2) % (strataSize * 2);
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.fillStyle = strataPattern || "#263235";
    ctx.fillRect(-offsetX, -offsetY, VW, VH);
    ctx.restore();

    // 漂浮尘埃
    for (const m of dust) {
        const a = .05 + .09 * (0.5 + 0.5 * Math.sin(m.p * 2));
        ctx.fillStyle = "rgba(205,220,235," + a.toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(m.x * VW, m.y * VH, m.s, 0, 7); ctx.fill();
    }
}
function drawVignette() {
    const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * .35, VW / 2, VH / 2, Math.max(VW, VH) * .75);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.55)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}

/* ------------------------- 绘制：吞噬形成的球形空洞 ------------------------- */
function projectCavity(cavity) {
    const s = projOf(cavity.wx, cavity.wy);
    const radius = cavity.radius * (1 - (1 - cavity.open) ** 2);
    return {
        x: s.x, y: s.y - radius * CFG.cavityCenterHeight, floorY: s.y, radius,
        rx: radius * CFG.cavityHorizontalRadius, ry: radius * CFG.cavityVerticalRadius
    };
}

function cavityOutline(first, second) {
    const path = new Path2D();
    const fullEllipse = p => {
        path.moveTo(p.x + p.rx, p.y);
        path.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2);
        path.closePath();
    };
    if (!second) { fullEllipse(first); return path; }

    // Divide out the shared ellipse stretch to find the intersections as circles.
    const dx = (second.x - first.x) / CFG.cavityHorizontalRadius;
    const dy = (second.y - first.y) / CFG.cavityVerticalRadius;
    const distance = Math.hypot(dx, dy);
    const r1 = first.radius, r2 = second.radius;
    if (distance >= r1 + r2) {
        fullEllipse(first);
        fullEllipse(second);
        return path;
    }
    if (distance <= Math.abs(r1 - r2)) {
        fullEllipse(r1 >= r2 ? first : second);
        return path;
    }

    // Connect only the two arcs outside the overlap, so no rim crosses the opening.
    const bearing = Math.atan2(dy, dx);
    const firstCut = Math.acos(clamp((distance ** 2 + r1 ** 2 - r2 ** 2) / (2 * distance * r1), -1, 1));
    const secondCut = Math.acos(clamp((distance ** 2 + r2 ** 2 - r1 ** 2) / (2 * distance * r2), -1, 1));
    path.ellipse(first.x, first.y, first.rx, first.ry, 0, bearing + firstCut, bearing + Math.PI * 2 - firstCut);
    path.ellipse(second.x, second.y, second.rx, second.ry, 0, bearing + Math.PI + secondCut, bearing + Math.PI * 3 - secondCut);
    path.closePath();
    return path;
}

function drawCavity(cavity, t) {
    const shape = projectCavity(cavity);
    const other = cavity.mergedWith ? projectCavity(cavity.mergedWith) : null;
    const visible = p => p.x + p.rx + 8 >= 0 && p.x - p.rx - 8 <= VW && p.y + p.ry + 8 >= 0 && p.y - p.ry - 8 <= VH;
    if (!visible(shape) && !(other && visible(other))) return;
    const outline = cavityOutline(shape, other);
    const cx = other ? (shape.x + other.x) / 2 : shape.x;
    const cy = other ? (shape.y + other.y) / 2 : shape.y;
    const extent = other ? Math.max(shape.rx, other.rx) + Math.hypot(shape.x - other.x, shape.y - other.y) / 2 : shape.rx;
    const g = ctx.createRadialGradient(cx - extent * .16, cy - extent * .17, extent * .12, cx, cy, extent * 1.04);
    g.addColorStop(0, "#080f13");
    g.addColorStop(.68, "#131d22");
    g.addColorStop(.88, "#263234");
    g.addColorStop(1, "#46514a");
    ctx.fillStyle = g;
    ctx.fill(outline);

    ctx.strokeStyle = "#101619";
    ctx.lineWidth = 8;
    ctx.stroke(outline);
    ctx.strokeStyle = "#7f89745e";
    ctx.lineWidth = 2;
    ctx.stroke(outline);
    if (!other) {
        ctx.strokeStyle = "#677b7166";
        ctx.beginPath(); ctx.ellipse(shape.x, shape.y, shape.rx * .91, shape.ry * .93, 0, Math.PI * .93, Math.PI * 1.79); ctx.stroke();
    }

    // A thin bedrock ledge at the base gives the character a visible footing.
    if (cavity.open > .7) {
        const { x, floorY, radius } = shape;
        const floor = ctx.createLinearGradient(0, floorY - radius * .09, 0, floorY + radius * .09);
        floor.addColorStop(0, "#64736b");
        floor.addColorStop(1, "#2d3a37");
        ctx.fillStyle = floor;
        ctx.beginPath(); ctx.ellipse(x, floorY, radius * .43, radius * .09, 0, 0, Math.PI * 2); ctx.fill();
    }

    const activeCorrection = cavity.correction && (cavity === currentCavity || cavity === landInfo?.cavity);
    if (cavity === nextCavity || activeCorrection) {
        ctx.save();
        ctx.strokeStyle = "#8fe4cf";
        ctx.globalAlpha = .32 + .18 * Math.sin(t * 3);
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 7]); ctx.lineDashOffset = -t * 20;
        ctx.stroke(outline);
        ctx.restore();
    }
}

function drawEasterEgg(cavity) {
    if (!easterEggReady) return;
    const s = projOf(cavity.wx, cavity.wy);
    const width = Math.min(126, cavity.radius * 1.15);
    const height = width * easterEggImage.naturalHeight / easterEggImage.naturalWidth;
    ctx.drawImage(easterEggImage, s.x + cavity.radius * .28 - width / 2, s.y - height, width, height);
}

/* ------------------------- 绘制：传送洞 ------------------------- */
function drawHole(wx, wy, r, height = 0) {
    if (r <= 0.01) return;
    const s = projOf(wx, wy);
    s.y -= height;
    const rx = 48 * r, ry = 23 * r;
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#597065";
    ctx.lineWidth = 1.5;
    ctx.stroke();
}

/* ------------------------- 绘制：人物 ------------------------- */
function hopOffset() {
    const ht = clamp(stateT * 1000 / CFG.hopMs, 0, 1);
    return -4 * CFG.hopH * ht * (1 - ht);          // 小跳抛物线偏移
}
function groundedMotionFrame() {
    // The three authored poses are anticipation, landing compression, and recovery.
    if (state === ST.TAKEOFF) return stateT < .042 ? 2 : 0;
    if (state === ST.LAND && stateT < .24) return stateT < .10 ? 1 : 2;
    return null;
}
function frameHeight(frame) {
    return frame ? CFG.playerH * frame.sh / frame.referenceHeight : CFG.playerH;
}

function drawPlayer() {
    if (state === ST.OVER) return;
    if (state === ST.SINK) {
        drawPlayerAt(player.wx, player.wy, currentCavity, rabbitForm, "entry");
        if (player.sink > 0) {
            drawPlayerAt(skyHole.wx, skyHole.wy, landInfo.cavity, rabbitForm || rabbitTransformPending, "exit");
        }
        return;
    }
    const cavity = state === ST.FALLING ? landInfo.cavity : currentCavity;
    drawPlayerAt(player.wx, player.wy, cavity, rabbitForm);
}

function drawPlayerAt(wx, wy, cavity, asRabbit, transferSide) {
    const s = projOf(wx, wy);
    const useRabbit = asRabbit && rabbitSprite.ready;
    const baseFrames = useRabbit ? rabbitSprite.frames : spriteFrames;
    const motion = useRabbit ? rabbitMotion : playerMotion;
    const motionFrame = motion.ready && baseFrames.length ? groundedMotionFrame() : null;
    let fi = 0;
    if (state === ST.SINK) fi = 1;
    else if (state === ST.HOP) {
        const hop = stateT * 1000 / CFG.hopMs;
        fi = hop >= .24 && hop < .65 ? 2 : 1;
    } else if (state === ST.FALLING) {
        fi = player.drop + skyHole.height < frameHeight(baseFrames[3]) ? 1 : 3;
    } else if (state === ST.DYING) fi = 3;
    else if (state === ST.LAND && stateT < .24) fi = 4;
    player.frame = fi;

    const useMotion = motionFrame !== null;
    const image = useMotion ? motion.image : useRabbit ? rabbitSprite.image : sprite;
    const frame = useMotion ? motion.frames[motionFrame] : baseFrames[fi];
    // Match the new poses to the existing standing frame and keep the same foot anchor.
    const height = useMotion ? frameHeight(baseFrames[0]) * .97 * frame.sh / frame.referenceHeight : frameHeight(frame);
    let sq = 1, st = 1;
    if (state === ST.TAKEOFF && !useMotion) {
        const crouch = clamp(stateT * 1000 / CFG.takeoffMs, 0, 1);
        sq = 1 - crouch * .10;
        st = 1 + crouch * .06;
    }
    if (state === ST.HOP) st = .96;
    if (state === ST.LAND && !useMotion) {
        sq = 1 - player.squash * .22;
        st = 1 + player.squash * .16;
    }

    const exitPlane = s.y - skyHole.height;
    let fy = s.y;
    if (transferSide) fy = (transferSide === "entry" ? s.y : exitPlane) + height * player.sink;
    else if (state === ST.HOP) fy += hopOffset();
    else if (state === ST.FALLING || state === ST.DYING) fy += player.drop;

    ctx.save();
    if (cavity && state !== ST.DYING) {
        const merged = cavity.mergedWith ? projectCavity(cavity.mergedWith) : null;
        ctx.clip(cavityOutline(projectCavity(cavity), merged));
    }

    // Both sides reveal different portions of the pose at the same crossing progress.
    if (transferSide === "entry") {
        ctx.beginPath();
        ctx.rect(0, 0, VW, Math.max(0, s.y));
        ctx.clip();
    }
    if (transferSide === "exit" || (state === ST.FALLING && skyHole.active)) {
        const clipY = Math.max(0, exitPlane);
        ctx.beginPath();
        ctx.rect(0, clipY, VW, Math.max(0, VH - clipY));
        ctx.clip();
    }

    if (!transferSide && state !== ST.DYING) {
        const hAbove = clamp(s.y - fy, -200, 400);
        const sh = clamp(1 - hAbove / 420, .18, 1);
        ctx.fillStyle = "rgba(0,0,0," + (.34 * sh).toFixed(2) + ")";
        ctx.beginPath(); ctx.ellipse(s.x, s.y + 3, 26 * sh + 8, 10 * sh + 3, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.translate(s.x, fy);
    if (player.wobble > 0.01) ctx.rotate(Math.sin(stateT * 22) * .07 * player.wobble);
    ctx.scale(st * playerFacing(), sq);
    if (image) {
        const width = height * frame.sw / frame.sh;
        const anchorX = typeof frame.anchorX === "number" ? frame.anchorX : frame.sw / 2;
        ctx.drawImage(image, frame.sx, frame.sy, frame.sw, frame.sh, -anchorX * height / frame.sh, -height, width, height);
    } else {
        drawFallback(fi, CFG.playerH);
    }
    ctx.restore();
}
// 无素材时的矢量占位人物（3/4 背面）
function drawFallback(fi, H) {
    const crouch = fi === 1 ? .8 : fi === 4 ? .78 : 1;
    const air = fi === 2 || fi === 3;
    ctx.save();
    ctx.scale(1, crouch);
    ctx.fillStyle = "#3d4b63";                       // 斗篷
    ctx.beginPath(); ctx.ellipse(0, -H * .42, H * .2, H * .3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#2c3547";                       // 头
    ctx.beginPath(); ctx.arc(0, -H * .78, H * .15, 0, 7); ctx.fill();
    ctx.fillStyle = "#e8e2d5";                       // 腿
    ctx.fillRect(-H * .09, -H * .18, H * .07, H * .18 - (air ? H * .05 : 0));
    ctx.fillRect(H * .02, -H * .18, H * .07, H * .18 - (air ? H * .05 : 0));
    ctx.restore();
}

/* ------------------------- 绘制：UI 层 ------------------------- */
function drawChargeUI() {
    if (state !== ST.CHARGING) return;
    const s = projOf(player.wx, player.wy);
    // 蓄力条
    const bw = 130, bh = 10, bx = s.x - bw / 2, by = s.y - CFG.playerH - 34;
    ctx.fillStyle = "rgba(10,12,16,.65)";
    roundRect(bx - 3, by - 3, bw + 6, bh + 6, 7); ctx.fill();
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, "#6fe3b8"); g.addColorStop(.6, "#ffd479"); g.addColorStop(1, "#ff7a6b");
    ctx.fillStyle = g;
    roundRect(bx, by, bw * power, bh, 5); ctx.fill();
    if (!showLandingHint) return;
    // 预测落点环
    const preview = predictLanding();
    const ls = projOf(preview.wx, preview.wy);
    ctx.strokeStyle = "#7ef0c8";
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.ellipse(ls.x, ls.y, 20, 10, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(ls.x, ls.y, 6, 3, 0, 0, 7); ctx.stroke();
}
function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}
function drawPopups() {
    for (const p of popups) {
        const a = 1 - p.t / p.life;
        ctx.font = "bold 30px 'PingFang SC','Microsoft YaHei',Arial";
        ctx.textAlign = "center";
        ctx.fillStyle = p.color;
        ctx.globalAlpha = clamp(a * 1.4, 0, 1);
        ctx.shadowColor = "rgba(0,0,0,.8)"; ctx.shadowBlur = 8;
        ctx.fillText(p.text, p.x, p.y);
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
}
function drawOverlay(t) {
    if (missionCavity || rabbitSubtitleTime > 0) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#d2bba3";
        ctx.font = Math.max(30, 26 / viewScale) + "px 'STKaiti','KaiTi','FangSong',serif";
        ctx.fillText(rabbitSubtitleTime > 0 ? "也太执着了啊喂！" : "营救成功 · 返回出发点", VW / 2, Math.max(VH * .24, promptTop), VW * .65);
        ctx.restore();
    }
    if (!started && state === ST.IDLE) {
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(238,243,248," + (.78 + .18 * Math.sin(t * 2.6)).toFixed(2) + ")";
        ctx.font = "bold " + Math.max(24, 20 / viewScale) + "px 'PingFang SC','Microsoft YaHei',Arial";
        ctx.fillText("按住蓄力 · 松开掘进", VW / 2, introY, VW * .9);
        ctx.font = Math.max(14, 12 / viewScale) + "px 'PingFang SC','Microsoft YaHei',Arial";
        ctx.fillStyle = "rgba(238,243,248,.68)";
        ctx.fillText("每跳最多 50 m · 对准前方吞出的空洞", VW / 2, introY + Math.max(26, 26 / viewScale), VW * .9);
    }
    if (state === ST.OVER || state === ST.COMPLETE) {
        const complete = state === ST.COMPLETE;
        ctx.fillStyle = "rgba(8,10,13,.72)"; ctx.fillRect(0, 0, VW, VH);
        ctx.textAlign = "center";
        ctx.fillStyle = "#eef3f8";
        ctx.font = "bold 44px 'PingFang SC','Microsoft YaHei',Arial";
        const result = complete ? "任务完成 · 已返回" : nextCavity ? "师傅修正已用完" : "前方已无空洞";
        ctx.fillText(result, VW / 2, VH * 0.42);
        ctx.font = "bold 26px 'PingFang SC','Microsoft YaHei',Arial";
        ctx.fillStyle = "#7ef0c8";
        const summary = complete ? "掘进 " + formatDistance(mission.travelled) + "   ·   得分 " + score
            : "本局得分 " + score + "   ·   最佳 " + best;
        ctx.fillText(summary, VW / 2, VH * 0.42 + 46);
        ctx.font = "18px 'PingFang SC','Microsoft YaHei',Arial";
        ctx.fillStyle = "rgba(238,243,248," + (.8 + .15 * Math.sin(t * 3)).toFixed(2) + ")";
        ctx.fillText("点击 / 空格 再来一次", VW / 2, VH * 0.42 + 92);
    }
    // 静音标识

}

/* ------------------------- 主渲染 ------------------------- */
function render(t) {
    drawBackground();

    for (const cavity of cavities) {
        if (!cavity.mergedInto) drawCavity(cavity, t);
    }
    if (missionCavity) drawEasterEgg(missionCavity);
    if (hole.active) drawHole(hole.wx, hole.wy, hole.r);
    if (skyHole.active) drawHole(skyHole.wx, skyHole.wy, 1, skyHole.height);
    drawPlayer();

    // 粒子
    for (const b of bursts) {
        ctx.fillStyle = "rgba(" + b.c + "," + (1 - b.t / b.life).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (1 - b.t / b.life * .5), 0, 7); ctx.fill();
    }

    drawVignette();
    drawChargeUI();
    if (state !== ST.OVER && state !== ST.COMPLETE) drawPopups();
    drawOverlay(t);
}

/* ------------------------- 主循环 ------------------------- */
let last = performance.now();
function loop(now) {
    const dt = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    update(dt);
    render(now / 1000);
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
